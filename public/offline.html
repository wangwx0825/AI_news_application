<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2a6496" />
    <title>AI News Application</title>
    <style>
      :root {
        color: #2c2c2a;
        background: #f8f6f1;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 440px);
        border: 1px solid #e0ddd5;
        border-radius: 8px;
        background: #fff;
        padding: 28px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 24px;
      }

      p {
        margin: 0;
        color: #6b6960;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>暂时无法连接</h1>
      <p>你可以继续查看已缓存的应用资源。网络恢复后，重新打开应用即可获取最新 AI 新闻。</p>
    </main>
  </body>
</html>
